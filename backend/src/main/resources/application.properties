spring.application.name=reon-backend
spring.profiles.default=dev
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
youtube.api-key=${YOUTUBE_API_KEY:}
google.client-id=${GOOGLE_CLIENT_ID:}
auth.session-ttl=PT1H
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
youtube.oauth.client-id=${GOOGLE_CLIENT_ID:}
youtube.oauth.client-secret=${GOOGLE_CLIENT_SECRET:}
youtube.oauth.redirect-uri=${YOUTUBE_REDIRECT_URI:}
youtube.oauth.encryption-key=${YOUTUBE_TOKEN_ENCRYPTION_KEY:}
spring.config.import=optional:file:./.env[.properties]

memory.engine-url=${MEMORY_ENGINE_URL:http://127.0.0.1:18081}
memory.engine-token=${REON_ENGINE_TOKEN:}
