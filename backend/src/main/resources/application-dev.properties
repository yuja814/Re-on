# Local development only. Data survives restarts and is ignored by Git.
spring.datasource.url=jdbc:h2:file:./data/reon;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.platform=h2

spring.sql.init.schema-locations=classpath:schema-h2.sql,classpath:db/memory-schema.sql
